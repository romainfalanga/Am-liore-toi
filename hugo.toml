baseURL = "/"
languageCode = "fr"
title = "Ameliore-toi | Communication, Productivite, Memorisation"
defaultContentLanguage = "fr"
enableRobotsTXT = true
enableGitInfo = false
buildFuture = true

[params]
  description = "Devenez une meilleure version de vous-meme grace a nos articles quotidiens sur la communication, la productivite et la memorisation."
  author = "Ameliore-toi"
  mainSections = ["communication", "productivite", "memorisation"]

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "keywords"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10

[menu]
  [[menu.main]]
    name = "Communication"
    url = "/communication/"
    weight = 1
  [[menu.main]]
    name = "Productivite"
    url = "/productivite/"
    weight = 2
  [[menu.main]]
    name = "Memorisation"
    url = "/memorisation/"
    weight = 3

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
